services:
  - type: web
    name: techguard-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: TG_USERNAME
        sync: false
      - key: TG_PASSWORD
        sync: false
